<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Scamp</title>
    <!-- Google Fonts used in the font picker. Preconnect for speed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@100..900&family=Lato:wght@100..900&family=Merriweather:wght@300..900&family=Montserrat:wght@100..900&family=Nunito:wght@200..900&family=Open+Sans:wght@300..800&family=Playfair+Display:wght@400..900&family=Poppins:wght@100..900&family=Raleway:wght@100..900&family=Roboto:wght@100..900&family=Source+Sans+3:wght@200..900&family=Ubuntu:wght@300..700&display=swap"
    />
    <!-- Pre-paint the persisted theme so a light-mode user never flashes
         dark. Reads the same localStorage mirror as `@lib/appTheme`; dark
         is the fallback before any preference exists. Keep the key in sync
         with THEME_STORAGE_KEY. -->
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem('scamp.theme') === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          root.style.background = t === 'light' ? '#f5f5f5' : '#1a1a1a';
          root.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
